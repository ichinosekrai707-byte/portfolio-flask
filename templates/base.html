<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Adrian Roxas{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="nav">
        <a class="brand" href="{{ url_for('home') }}">AR<span>_</span></a>
        <nav>
            <a href="{{ url_for('home') }}#about">About</a>
            <a href="{{ url_for('home') }}#skills">Skills</a>
            <a href="{{ url_for('home') }}#projects">Projects</a>
            <a href="{{ url_for('home') }}#contact">Contact</a>
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}" role="status">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>&copy; Adrian Roxas</span>
        <a href="{{ url_for('admin') }}">Admin</a>
    </footer>
</body>
</html>
